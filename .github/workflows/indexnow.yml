name: Notify IndexNow

on:
  pull_request:
    paths:
      - '.github/workflows/indexnow.yml'
      - '1183d7aa000862662d3c78880d794e15.txt'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/indexnow.yml'
      - '1183d7aa000862662d3c78880d794e15.txt'
      - 'CNAME'
      - 'index.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: indexnow-${{ github.ref }}
  cancel-in-progress: true

env:
  INDEXNOW_KEY: 1183d7aa000862662d3c78880d794e15
  INDEXNOW_KEY_LOCATION: https://zevarix.com/1183d7aa000862662d3c78880d794e15.txt
  INDEXNOW_URL: https://zevarix.com/

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate IndexNow key file
        shell: bash
        run: |
          set -euo pipefail

          key_file="${INDEXNOW_KEY}.txt"
          [ -f "$key_file" ] || {
            printf 'IndexNow key file is missing: %s\n' "$key_file" >&2
            exit 1
          }

          [ "$(cat "$key_file")" = "$INDEXNOW_KEY" ] || {
            echo 'IndexNow key file content does not match the configured key' >&2
            exit 1
          }

  notify:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Wait for matching GitHub Pages deployment
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pages_ready=0
          for attempt in $(seq 1 30); do
            state=$(
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
                --jq '.workflow_runs[] | select(.name == "pages build and deployment") | "\(.status)|\(.conclusion // "")"' |
                head -n 1 || true
            )

            if [ -n "$state" ]; then
              IFS='|' read -r status conclusion <<< "$state"
              if [ "$status" = 'completed' ]; then
                [ "$conclusion" = 'success' ] || {
                  printf 'GitHub Pages deployment completed with %s\n' "$conclusion" >&2
                  exit 1
                }
                pages_ready=1
                break
              fi
            fi

            sleep 10
          done

          [ "$pages_ready" -eq 1 ] || {
            echo 'matching successful GitHub Pages deployment was not observed in time' >&2
            exit 1
          }

      - name: Verify published IndexNow key
        shell: bash
        run: |
          set -euo pipefail

          served_key=$(
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 2 \
              "$INDEXNOW_KEY_LOCATION"
          )

          [ "$served_key" = "$INDEXNOW_KEY" ] || {
            echo 'published IndexNow key does not match the configured key' >&2
            exit 1
          }

      - name: Notify IndexNow
        shell: bash
        run: |
          set -euo pipefail

          response_file="$RUNNER_TEMP/indexnow-response.txt"
          http_code=$(
            curl --silent --show-error --location \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --get 'https://api.indexnow.org/indexnow' \
              --data-urlencode "url=$INDEXNOW_URL" \
              --data-urlencode "key=$INDEXNOW_KEY"
          )

          case "$http_code" in
            200|202)
              printf 'IndexNow accepted %s with HTTP %s\n' "$INDEXNOW_URL" "$http_code"
              ;;
            *)
              printf 'IndexNow returned HTTP %s\n' "$http_code" >&2
              cat "$response_file" >&2 || true
              exit 1
              ;;
          esac
